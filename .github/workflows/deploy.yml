name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Allow one concurrent deployment.
#
# cancel-in-progress MUST stay false. GitHub Pages serialises deployments
# per environment, and a run cancelled *mid-deploy* leaves its Pages
# deployment in progress on the backend for ~10-11 min. Every run behind it
# is then rejected outright with HTTP 400 "Deployment request failed ... due
# to in progress deployment. Please cancel <sha> first or wait for it to
# complete." See the note on the deploy step below for the measurement.
#
# With false, a newer push waits for the in-flight deploy instead of killing
# it. GitHub still keeps only ONE pending run per group -- older pending runs
# are cancelled *before they start*, so they never create a Pages deployment
# and never leave a blocker behind. Runs still show up as "cancelled", but
# harmlessly, and the surviving pending run always carries the newest data.
# This matches GitHub's own Pages starter workflow, which uses false.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry1.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          CHAT_API_URL: ${{ secrets.CHAT_API_URL }}
          CHAT_TOKEN: ${{ secrets.CHAT_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 2026-07-05: actions/deploy-pages occasionally fails outright. The
      # artifact above builds and uploads fine every time this happens, so
      # retrying a couple of times with a short backoff was added here.
      #
      # 2026-08-06: the original diagnosis in this comment ("a GitHub Pages
      # backend rejection", and "the concurrency group above already prevents
      # two workflow runs from truly overlapping") was WRONG, and the retry
      # ladder never actually addressed the real cause. Pulled the failure
      # annotations for all 11 failures in the last 100 main-branch runs:
      #
      #   5  HTTP 400 "Deployment request failed for <sha> due to in progress
      #                deployment. Please cancel <sha> first..."
      #   4  "Deployment cancelled."  (job ran ~11.5 min, then gave up)
      #   -- those 9 are one unbroken cascade, 11:46-14:02 UTC --
      #   1  "job was not acquired by Runner of type hosted"  \ GitHub Actions
      #   1  "Invalid actions OIDC token"                     / outage, below
      #
      # The first two are the same fault, ping-ponging. `cancel-in-progress:
      # true` killed runs mid-deploy; each one left a Pages deployment stuck
      # in progress for ~10-11 min; the next run was rejected instantly with
      # the 400; the run after that got starved and timed out into
      # "Deployment cancelled."; repeat. Every one of the 9 named the
      # immediately preceding run as its blocker. Two links in that chain
      # were blocked by runs this concurrency group had *cancelled*
      # (13:32 was blocked by 761bcc21, a cancelled run), which is the
      # direct proof that a cancelled run leaves a blocking deployment.
      # So 9 of 11 failures traced to the concurrency setting, not to Pages
      # being flaky. Fixed by setting cancel-in-progress: false above.
      #
      # CAVEAT for whoever verifies this fix: GitHub opened a major Actions
      # + Pages outage at 15:22 UTC on 2026-08-06, ~1.5h after the cascade
      # above and shortly before this fix landed. Runs from 15:48 UTC onward
      # that hang in "queued", never reach "in_progress", and die as
      # cancelled/OIDC/runner errors are that outage, NOT this bug and NOT a
      # failed fix. Judge the fix on runs after the incident is resolved.
      #
      # Keep these backoffs SHORT. They are now only insurance against
      # genuine one-off transients (OIDC, runner acquisition). A failing run
      # holds the "pages" concurrency slot for as long as it keeps retrying,
      # which under cancel-in-progress: false delays the next deploy -- and
      # no realistic backoff can outwait a ~10 min Pages lock anyway.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry 2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry 2)
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
