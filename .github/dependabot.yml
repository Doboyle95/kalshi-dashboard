version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      observable-build-toolchain:
        patterns:
          - "@observablehq/*"
          - "@rollup/*"
          - "esbuild"
          - "rollup"
          - "rollup-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
